<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Smithsonian Viewer</title>

	<!-- This optional line provides a custom Voyager icon used for favorite/bookmarked pages. -->
	<link rel="shortcut icon" type="image/png" href="assets/favicon-hdpi.png"/>

	<!-- This stylesheet is recommended to load custom Voyager fonts. Not required, but may result in suboptimal UI without it. -->
	<link href="https://cdn.jsdelivr.net/gh/smithsonian/dpo-voyager@latest/assets/fonts/fonts.css" rel="stylesheet">
	<link href="assets/style.css" rel="stylesheet">
</head>
<body>
	<h1>Earth Science 3D</h1>
	<ul>
{%- for page in pages %}
		<li>
			<a href="{{ page.filename | urlencode }}">
				{%- if page.thumbnail %}
				<img src="assets/{{ page.folder }}/{{ page.thumbnail }}" alt="">
				{%- endif %}
				<h2>
					{{ page.title }}
				</h2>
				{%- if page.description %}
					<p>{{ page.description }}</p>
				{%- endif %}
			</a>
		</li>
{%- endfor %}
	</ul>
</body>
</html>
